name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Run UI tests
        run: npm run test:ui

      # After the Storybook build so story links are checked against the real index.
      - name: Test MCP server
        run: npm ci && npm test
        working-directory: mcp

      - name: Upload Storybook to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: npm run test:visual:ci

      - name: Skip Chromatic upload
        if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
        run: echo "CHROMATIC_PROJECT_TOKEN is not configured; skipping Chromatic upload."

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
